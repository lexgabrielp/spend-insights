server:
  port: 8080
spring:
  application.name: spend-insights
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spendinsights}
    username: ${SPRING_DATASOURCE_USERNAME:spend}
    password: ${SPRING_DATASOURCE_PASSWORD:spend_password}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway.enabled: true
  servlet.multipart.max-file-size: 20MB
  servlet.multipart.max-request-size: 25MB
  data.redis.host: ${REDIS_HOST:localhost}
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32chars}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:14}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:mistral:7b-instruct-q4_K_M}
    embed-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
logging.level.com.spendinsights: INFO
management.endpoints.web.exposure.include: health,info,metrics
springdoc.swagger-ui.path: /swagger-ui/index.html
